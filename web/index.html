<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Future Crew's legendary 1993 demo, ported to Flutter and upgraded.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Second Reality Flutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Second Reality Flutter</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // PURGE ANY SERVICE WORKER. We build with --pwa-strategy=none, so nothing
    // registers one now — but a worker registered by an EARLIER build keeps
    // controlling this origin forever, serving its cached main.dart.js and (19MB)
    // soundtrack.ogg no matter what Cache-Control the server sends. That makes a
    // rebuilt demo look completely unchanged, which cost us a long debugging
    // detour: the timings were fixed on disk while the browser played the old
    // build. Kill the worker AND its caches, then reload once so the page is
    // served fresh.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (!regs.length) return;
        console.log('[SR] purging ' + regs.length + ' stale service worker(s)');
        Promise.all(regs.map(function (r) { return r.unregister(); }))
          .then(function () {
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            });
          })
          .then(function () { location.reload(); });
      });
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
