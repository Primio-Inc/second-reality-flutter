# The demo, served at http://<host>/second-reality-flutter/
# Installed by tool/deploy_web.sh to /etc/nginx/sites-available/.
#
# default_server so it answers on a bare IP, with no domain name in play. Only
# ONE block may claim that per port, and Ubuntu's stock `default` site already
# does -- nginx refuses to start with "a duplicate default server for
# 0.0.0.0:80" -- so deploy_web.sh unlinks that stock site (the nginx welcome
# page) before enabling this one.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www;
    index index.html;

    # The one route. The trailing-slash redirect matters: without it,
    # /second-reality-flutter (no slash) resolves relative paths one level up.
    location = /second-reality-flutter {
        return 301 /second-reality-flutter/;
    }

    location /second-reality-flutter/ {
        alias /var/www/second-reality-flutter/;
        try_files $uri $uri/ /second-reality-flutter/index.html;

        # index.html and the bootstrap must NEVER be cached: they are how a new
        # build is discovered. Everything else is content-addressed enough that
        # a short cache is safe, and the 22MB soundtrack is worth caching.
        location ~* /(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js)$ {
            add_header Cache-Control "no-store, must-revalidate";
            expires -1;
        }

        # Assets: revalidate rather than trust. Chrome's plain HTTP cache will
        # otherwise serve a CHANGED file of the same name and size as stale --
        # a trap this project has already paid for once (see the porting notes).
        location ~* \.(js|json|png|jpg|ogg|sri|srt|srv|otf|ttf|wasm|symbols)$ {
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }
    }

    # Flutter web needs these served with the right type or the engine will not
    # start; nginx's stock mime.types has no .wasm on older Ubuntus.
    types {
        application/wasm  wasm;
        application/javascript  js mjs;
        audio/ogg  ogg;
        text/html  html;
    }

    # The bundle is ~70MB, most of it already-compressed .ogg. Compress the
    # text-ish parts only: gzipping the soundtrack burns CPU for nothing.
    gzip on;
    gzip_types application/javascript application/json application/wasm text/html text/css image/svg+xml;
    gzip_min_length 1024;

    # main.dart.js is ~2.5MB and the soundtrack 22MB; do not let a slow client
    # time out mid-download.
    client_max_body_size 1m;
    sendfile on;
}
